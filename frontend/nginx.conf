# SPA fallback: react-router-dom (client-side routing) means a direct
# request for e.g. /triage or /automation has no matching file on disk - # nginx must still return index.html so React Router can render the right
# screen client-side, instead of nginx's default 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
